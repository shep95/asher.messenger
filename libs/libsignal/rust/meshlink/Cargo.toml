[package]
name = "meshlink"
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Store-carry-forward transport that carries Signal Protocol ciphertext over non-internet links with device-keyed identity"

[lints]
workspace = true

[dependencies]
libsignal-core = { workspace = true }
libsignal-protocol = { workspace = true }

base64 = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
